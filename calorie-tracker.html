<style>
:root {

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--page-bg);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard Variable",Pretendard,"Segoe UI",Roboto,"Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;color:var(--text)}

button{cursor:pointer}

@media(min-width:480px){.phone{height:100dvh;max-height:860px;border-radius:28px;margin:20px 0}}

/* onboarding */
.chat-header{flex:none;display:flex;align-items:center;gap:10px;padding:14px 18px;background:var(--header-bg);border-bottom:1px solid var(--border)}

.thread{flex:1;min-height:0;overflow-y:auto;padding:16px 14px 8px;display:flex;flex-direction:column;gap:8px}.thread::-webkit-scrollbar{width:0}

@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

.card-bubble{max-width:88%;background:var(--bubble-bot);border-radius:18px;border-bottom-left-radius:5px;padding:18px 16px}.result-ring-wrap{position:relative;width:132px;height:132px;margin:4px auto 14px}.result-ring{width:100%;height:100%;transform:rotate(-90deg)}.ring-bg{fill:none;stroke:#e4e7ee;stroke-width:11}.ring-fg{fill:none;stroke:var(--accent);stroke-width:11;stroke-linecap:round;stroke-dasharray:396;stroke-dashoffset:396;transition:stroke-dashoffset .9s ease}.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.ring-center span{font-size:22px;font-weight:800}.ring-center small{font-size:11px;color:var(--text-muted)}

.energy-breakdown{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 12px}.energy-pill{background:#fff;border:1px solid rgba(0,0,0,.05);border-radius:12px;padding:9px 10px}.energy-pill span{display:block;font-size:10px;color:var(--text-muted);margin-bottom:2px}.energy-pill b{font-size:12px}
.meal-row{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid rgba(0,0,0,.06);font-size:13px}.meal-row .meal-kcal{color:var(--text-muted)}
.input-bar{flex:none;border-top:1px solid var(--border);background:var(--header-bg);padding:10px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom))}.input-row{display:flex;align-items:center;gap:8px}.input-row input{flex:1;border:1px solid var(--border);background:#fff;border-radius:20px;padding:10px 16px;font-size:15px;color:var(--text);outline:none;min-width:0}.input-row input:focus{border-color:var(--accent)}.unit-tag{flex:none;font-size:13px;color:var(--text-muted)}.send-btn{flex:none;width:36px;height:36px;border-radius:50%;border:none;background:var(--accent);color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center}.send-btn:disabled{opacity:.35;cursor:default}.error-msg{font-size:12px;color:var(--danger);padding:0 6px 6px}.chip-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.chip{padding:10px 18px;border-radius:20px;border:1.5px solid var(--accent);background:#fff;color:var(--accent);font-size:14px;font-weight:600}.chip:hover{background:var(--accent-soft)}.chip:active{transform:scale(.97)}.cta-row{display:flex}.cta-btn{flex:1;padding:13px;border:none;border-radius:20px;background:var(--accent);color:#fff;font-size:15px;font-weight:700}

.energy-line{margin-top:15px;padding-top:13px;border-top:1px solid rgba(47,155,255,.12);display:flex;gap:10px;justify-content:space-between}.energy-stat{flex:1}.energy-stat span{display:block;color:var(--text-muted);font-size:10px}.energy-stat b{display:block;font-size:12px;margin-top:2px}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 9px}.section-title h2{font-size:16px;margin:0}.section-title span{font-size:11px;color:var(--text-muted)}
.macro-card{border:1px solid var(--border);border-radius:18px;padding:14px;background:#fff}.macro-progress-item+.macro-progress-item{margin-top:12px}.macro-progress-head{display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px}.macro-progress-head span:last-child{color:var(--text-muted)}.progress-track{height:7px;background:#eef0f3;border-radius:99px;overflow:hidden}.progress-fill{height:100%;border-radius:99px;transition:width .25s ease}.progress-fill.carb{background:var(--carb)}.progress-fill.protein{background:var(--protein)}.progress-fill.fat{background:var(--fat)}

/* bottom sheet */
.sheet-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.28);z-index:20;display:flex;align-items:flex-end;animation:fadeIn .18s ease}@keyframes fadeIn{from{opacity:0}to{opacity:1}}.sheet{width:100%;max-height:92%;overflow-y:auto;background:#fff;border-radius:24px 24px 0 0;padding:12px 16px max(18px,env(safe-area-inset-bottom));box-shadow:0 -12px 40px rgba(0,0,0,.16);animation:sheetUp .22s ease}@keyframes sheetUp{from{transform:translateY(30px);opacity:.7}to{transform:translateY(0);opacity:1}}.sheet-handle{width:36px;height:4px;border-radius:99px;background:#dadce1;margin:0 auto 12px}.sheet-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.sheet-title h3{margin:0;font-size:17px}.sheet-close{border:none;background:transparent;font-size:24px;color:#777}.field{margin-bottom:12px}.field label{display:block;font-size:11px;color:var(--text-muted);margin:0 0 5px 4px}.field input,.field select{width:100%;border:1px solid var(--border);border-radius:13px;padding:11px 12px;background:#fff;color:var(--text);outline:none}.field input:focus,.field select:focus{border-color:var(--accent)}.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sheet-save{width:100%;border:none;background:var(--accent);color:#fff;border-radius:14px;padding:13px;font-weight:750;margin-top:4px}.sheet-error{min-height:16px;color:var(--danger);font-size:11px;margin:0 4px 4px}.photo-section{margin:2px 0 12px}.photo-section-label{display:flex;align-items:center;justify-content:space-between;margin:0 4px 7px}.photo-section-label span:first-child{font-size:11px;color:var(--text-muted)}.photo-section-label span:last-child{font-size:10px;color:#b0b1b7}.photo-pickers{display:grid;grid-template-columns:1fr 1fr;gap:8px}.photo-pick-btn{border:1px solid var(--border);background:#f8f9fb;border-radius:13px;padding:11px 8px;font-size:12px;font-weight:650;color:#45484e}.photo-pick-btn:active{transform:scale(.98)}.photo-input{display:none}.photo-preview-wrap{display:none;position:relative;margin-top:9px;border-radius:15px;overflow:hidden;background:#f4f5f7;border:1px solid var(--border)}.photo-preview-wrap.show{display:block}.photo-preview{display:block;width:100%;height:150px;object-fit:cover}.photo-remove{position:absolute;top:8px;right:8px;width:30px;height:30px;border:none;border-radius:50%;background:rgba(20,20,22,.72);color:#fff;font-size:18px;line-height:1}.photo-status{display:none;margin:7px 4px 0;font-size:11px;color:var(--text-muted)}.photo-status.show{display:block}.photo-note{font-size:10px;color:var(--text-muted);line-height:1.45;margin:7px 4px 0}.analysis-card{margin:10px 0 12px;padding:12px;border:1px solid #dcecff;background:#f7fbff;border-radius:14px}.analysis-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}.analysis-title strong{font-size:12px}.analysis-badge{font-size:10px;font-weight:750;padding:4px 7px;border-radius:99px;background:#e9eef5;color:#6e7480}.analysis-badge.working{background:#eaf5ff;color:var(--accent)}.analysis-badge.ok{background:#eafaf0;color:#168447}.analysis-badge.web{background:#fff5e6;color:#9a6500}.analysis-badge.manual{background:#fff0ef;color:#bd3d34}.analysis-message{font-size:11px;color:#626a76;line-height:1.5;word-break:keep-all}.analysis-sources{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}.analysis-sources a{font-size:9px;color:var(--accent);text-decoration:none;background:#fff;border:1px solid #d9e9fb;border-radius:99px;padding:4px 7px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.db-hint{min-height:15px;font-size:10px;line-height:1.4;color:var(--text-muted);margin:-6px 4px 10px}.db-hint.found{color:#168447}.db-hint.searching{color:var(--accent)}.auto-filled{border-color:#8ad9a5!important;background:#fbfffc!important}.sheet-save:disabled{opacity:.5;cursor:default}
.profile-popover{position:absolute;top:58px;right:12px;z-index:15;background:#fff;border:1px solid var(--border);border-radius:15px;padding:7px;box-shadow:0 10px 30px rgba(0,0,0,.12);min-width:170px}.profile-popover button{width:100%;text-align:left;border:none;background:transparent;padding:10px 11px;border-radius:10px;font-size:13px}.profile-popover button:hover{background:#f5f6f8}.profile-popover .danger{color:var(--danger)}

.label-line{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 4px 5px}.label-line label{margin:0!important}.auto-fill-btn{border:1px solid #cfe5ff;background:#f4f9ff;color:var(--accent);border-radius:10px;padding:6px 9px;font-size:10px;font-weight:750;white-space:nowrap}.auto-fill-btn:disabled{opacity:.45}.serving-block{margin:0 0 12px}.serving-line{display:flex;align-items:center;justify-content:space-between;gap:10px}.serving-line>span{font-size:11px;color:var(--text-muted)}.stepper{display:flex;align-items:center;gap:6px}.stepper button{width:31px;height:31px;border:1px solid var(--border);background:#fff;border-radius:10px;font-size:18px;line-height:1}.stepper input{width:64px;text-align:center;border:1px solid var(--border);border-radius:10px;padding:7px 5px;outline:none}.serving-note{font-size:10px;color:var(--text-muted);margin:6px 4px 0}.calorie-input-row{display:flex;align-items:center;gap:8px}.calorie-input-row input{flex:1;min-width:0}.nutrition-toggle{flex:none;display:flex;align-items:center;justify-content:center;gap:4px;border:1px dashed #cfd4dc;background:#fafbfc;color:#646b75;border-radius:12px;padding:10px 9px;font-size:10px;font-weight:700;white-space:nowrap}.optional-nutrition{display:none;margin-bottom:3px}.optional-nutrition.show{display:block}.macro-fields{grid-template-columns:repeat(3,1fr)}.macro-fields .field input{padding-left:9px;padding-right:9px}.item-preview{border-radius:13px;background:#f7f8fa;padding:10px 11px;margin:-2px 0 12px;font-size:11px;color:#5f6670;line-height:1.5}.item-preview strong{color:var(--text);font-size:12px}.entry-actions{display:grid;grid-template-columns:1fr 1.25fr;gap:8px;margin:2px 0 14px}.add-to-meal{border:1px solid #cfe5ff;background:#f4f9ff;color:var(--accent);border-radius:13px;padding:11px 8px;font-size:12px;font-weight:750}.clear-entry{border:1px solid var(--border);background:#fff;color:#70757f;border-radius:13px;padding:11px 8px;font-size:12px;font-weight:700}.pending-card{display:none;border:1px solid var(--border);border-radius:16px;overflow:hidden;margin:2px 0 12px}.pending-card.show{display:block}.pending-head{display:flex;align-items:center;justify-content:space-between;padding:11px 12px;background:#fafbfc;border-bottom:1px solid var(--border)}.pending-head strong{font-size:12px}.pending-head span{font-size:10px;color:var(--text-muted)}.pending-item{display:flex;align-items:center;gap:9px;padding:10px 12px;border-bottom:1px solid #f0f1f3}.pending-item:last-child{border-bottom:none}.pending-thumb{width:38px;height:38px;border-radius:9px;object-fit:cover;background:#f2f3f5;flex:none}.pending-info{flex:1;min-width:0}.pending-name{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pending-meta{font-size:9px;color:var(--text-muted);margin-top:2px}.pending-kcal{font-size:11px;font-weight:750}.pending-remove{border:none;background:transparent;color:#b5b6bb;font-size:18px;padding:2px}.share-wrap{border:1px solid var(--border);border-radius:15px;padding:11px 12px;margin-bottom:12px}.share-top{display:flex;align-items:center;justify-content:space-between;gap:8px}.share-top>div strong{display:block;font-size:12px}.share-top>div span{display:block;font-size:9px;color:var(--text-muted);margin-top:2px}.share-btn{border:1px solid #d6d9df;background:#fff;color:#5f6670;border-radius:11px;padding:8px 10px;font-size:10px;font-weight:750;white-space:nowrap}.share-btn.active{background:#eef7ff;border-color:#b9dcff;color:var(--accent)}.share-panel{display:none;align-items:center;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid #f0f1f3}.share-panel.show{display:flex}.share-panel span{font-size:11px;color:#5f6670}.people-count{display:flex;align-items:center;gap:6px}.people-count button{width:29px;height:29px;border:1px solid var(--border);background:#fff;border-radius:9px;font-size:16px}.people-count b{min-width:34px;text-align:center;font-size:12px}.group-summary{background:#f7fbff;border:1px solid #dcecff;border-radius:14px;padding:11px 12px;margin-bottom:10px}.group-summary .summary-row{display:flex;justify-content:space-between;gap:10px;font-size:11px;color:#626a76}.group-summary .summary-row+.summary-row{margin-top:5px}.group-summary .summary-row strong{color:var(--text)}.group-summary .per-person{font-size:13px;font-weight:800;color:var(--accent)}.macro-missing-note{font-size:9px;color:#a26b00;margin-top:8px;line-height:1.4}.source-chip{font-size:9px;color:#7a8089}.sheet-save{margin-top:0}.sheet-save:disabled,.add-to-meal:disabled{opacity:.5;cursor:default}

<div class="phone" id="phone">

    <div class="avatar">🥗</div>

<script>

const GOAL_ADJUST = { lose:-0.175, maintain:0, gain:0.125 };

  lose:{carb:.40,protein:.35,fat:.25}, maintain:{carb:.45,protein:.25,fat:.30}, gain:{carb:.45,protein:.30,fat:.25}

const MEAL_RATIO = [
  {key:"breakfast",label:"아침",emoji:"🌅",ratio:.25},

{name:"바나나",servingDescription:"100g",servingGrams:100,kcal:77,carb:20,protein:1.11,fat:.2,confidence:.95,aliases:["생바나나"]},

{name:"현미밥",servingDescription:"1공기(약 210g)",servingGrams:210,kcal:320,carb:69,protein:6.5,fat:2.2,confidence:.82},

const BASIC_FOOD_ALIASES=(()=>{const a={};BASIC_FOODS.forEach(f=>(f.aliases||[]).forEach(x=>a[normalizeFoodName(x)]=normalizeFoodName(f.name)));return a})();
const state={gender:null,age:null,height:null,weight:null,targetWeight:null,activityKcal:null,goal:null};
let thread=document.getElementById("thread"), inputBar=document.getElementById("input-bar"), headerStatus=document.getElementById("header-status");

function scrollToBottom(){if(thread)thread.scrollTop=thread.scrollHeight}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
function clearInputBar(){if(inputBar)inputBar.innerHTML=""}
function addUserMessage(text){const row=document.createElement("div");row.className="row user";row.innerHTML='<div class="bubble"></div>';row.querySelector(".bubble").textContent=text;thread.appendChild(row);scrollToBottom()}
async function addBotMessage(text,{delay=480}={}){const typing=document.createElement("div");typing.className="row bot typing";typing.innerHTML='<div class="bubble"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>';thread.appendChild(typing);scrollToBottom();await sleep(delay);typing.remove();const row=document.createElement("div");row.className="row bot";row.innerHTML='<div class="bubble"></div>';row.querySelector(".bubble").textContent=text;thread.appendChild(row);scrollToBottom()}
function addBotCard(html){const row=document.createElement("div");row.className="row bot";row.innerHTML=`<div class="card-bubble">${html}</div>`;thread.appendChild(row);scrollToBottom();return row}

function askText({placeholder,unit,inputMode="numeric",validate,displayFormat}){return new Promise(resolve=>{clearInputBar();const wrap=document.createElement("div");wrap.innerHTML=`<div class="input-row"><input type="text" inputmode="${inputMode}" placeholder="${placeholder}" autocomplete="off"/>${unit?`<span class="unit-tag">${unit}</span>`:""}<button class="send-btn" type="button" disabled>↑</button></div><div class="error-msg" style="display:none"></div>`;inputBar.appendChild(wrap);const input=wrap.querySelector("input"),btn=wrap.querySelector(".send-btn"),error=wrap.querySelector(".error-msg");input.addEventListener("input",()=>{btn.disabled=input.value.trim()==="";error.style.display="none"});function submit(){const raw=input.value.trim();if(!raw)return;const result=validate?validate(raw):{ok:true,value:raw};if(result.ok!==true){error.textContent=result.message||"다시 입력해 주세요.";error.style.display="block";input.focus();return}addUserMessage(displayFormat?displayFormat(result.value):raw);clearInputBar();resolve(result.value)}btn.addEventListener("click",submit);input.addEventListener("keydown",e=>{if(e.key==="Enter")submit()});setTimeout(()=>input.focus(),100)})}
function askChoice(options){return new Promise(resolve=>{clearInputBar();const wrap=document.createElement("div");wrap.className="chip-row";options.forEach(opt=>{const chip=document.createElement("button");chip.type="button";chip.className="chip";chip.textContent=opt.label;chip.addEventListener("click",()=>{addUserMessage(opt.label);clearInputBar();resolve(opt.value)});wrap.appendChild(chip)});inputBar.appendChild(wrap)})}
function showCTA(label,onClick){clearInputBar();const wrap=document.createElement("div");wrap.className="cta-row";const btn=document.createElement("button");btn.className="cta-btn";btn.textContent=label;btn.addEventListener("click",onClick);wrap.appendChild(btn);inputBar.appendChild(wrap)}
function numberValidator({min,max,isInt=true}){return raw=>{const n=Number(raw);if(Number.isNaN(n))return{ok:false,message:"숫자로 입력해 주세요."};if(isInt&&!Number.isInteger(n))return{ok:false,message:"정수로 입력해 주세요."};if(n<min||n>max)return{ok:false,message:`${min}~${max} 사이로 입력해 주세요.`};return{ok:true,value:n}}}

function calcBMR({gender,weight,height,age}){const base=10*weight+6.25*height-5*age;return gender==="male"?base+5:base-161}
function calculate(){const bmr=calcBMR(state);const activityKcal=Number.isFinite(state.activityKcal)?state.activityKcal:Math.round(bmr*AUTO_ACTIVITY_RATE);const tdee=bmr+activityKcal;const goalKcal=Math.round(tdee*(1+GOAL_ADJUST[state.goal]));const ratio=MACRO_RATIO[state.goal];const macros={carb:Math.round(goalKcal*ratio.carb/4),protein:Math.round(goalKcal*ratio.protein/4),fat:Math.round(goalKcal*ratio.fat/9)};return{bmr:Math.round(bmr),activityKcal:Math.round(activityKcal),tdee:Math.round(tdee),goalKcal,macros}}
function renderResultCard({bmr,activityKcal,tdee,goalKcal,macros}){const meals=MEAL_RATIO.map(m=>`<div class="meal-row"><span>${m.label}</span><span class="meal-kcal">${Math.round(goalKcal*m.ratio).toLocaleString()} kcal</span></div>`).join("");const html=`<div class="result-ring-wrap"><svg class="result-ring" viewBox="0 0 140 140"><circle class="ring-bg" cx="70" cy="70" r="63"></circle><circle class="ring-fg" id="ring-fg" cx="70" cy="70" r="63"></circle></svg><div class="ring-center"><span>${goalKcal.toLocaleString()}</span><small>kcal / 일</small></div></div><div class="macro-row"><div class="macro"><span class="macro-dot carb"></span>탄수화물<b>${macros.carb}g</b></div><div class="macro"><span class="macro-dot protein"></span>단백질<b>${macros.protein}g</b></div><div class="macro"><span class="macro-dot fat"></span>지방<b>${macros.fat}g</b></div></div><div class="energy-breakdown"><div class="energy-pill"><span>기초대사량</span><b>${bmr.toLocaleString()} kcal</b></div><div class="energy-pill"><span>활동 소모량</span><b>${activityKcal.toLocaleString()} kcal</b></div><div class="energy-pill"><span>유지 필요량</span><b>${tdee.toLocaleString()} kcal</b></div><div class="energy-pill"><span>${GOAL_LABEL[state.goal]} 목표</span><b>${goalKcal.toLocaleString()} kcal</b></div></div>${meals}`;const row=addBotCard(html);requestAnimationFrame(()=>{const ring=row.querySelector("#ring-fg"),circ=396,filled=Math.min(goalKcal/3200,1);ring.style.strokeDashoffset=String(circ*(1-filled))})}
function saveProfile(computed){const profile={...state,...computed,savedAt:new Date().toISOString()};localStorage.setItem("calorieTracker.profile",JSON.stringify(profile));return profile}

function localDateKey(date=new Date()){const y=date.getFullYear(),m=String(date.getMonth()+1).padStart(2,"0"),d=String(date.getDate()).padStart(2,"0");return `${y}-${m}-${d}`}
function parseLocalDate(key){const [y,m,d]=key.split("-").map(Number);return new Date(y,m-1,d)}
function formatDateLabel(key){const d=parseLocalDate(key);const today=localDateKey();const yesterday=new Date();yesterday.setDate(yesterday.getDate()-1);const tomorrow=new Date();tomorrow.setDate(tomorrow.getDate()+1);if(key===today)return "오늘";if(key===localDateKey(yesterday))return "어제";if(key===localDateKey(tomorrow))return "내일";return `${d.getMonth()+1}월 ${d.getDate()}일`}
function logStorageKey(dateKey){return `calorieTracker.logs.${dateKey}`}
function getLogs(dateKey){try{return JSON.parse(localStorage.getItem(logStorageKey(dateKey)))||[]}catch{return[]}}
function setLogs(dateKey,logs){localStorage.setItem(logStorageKey(dateKey),JSON.stringify(logs))}
function sumLogs(logs){return logs.reduce((a,x)=>({kcal:a.kcal+Number(x.kcal||0),carb:a.carb+Number(x.carb||0),protein:a.protein+Number(x.protein||0),fat:a.fat+Number(x.fat||0)}),{kcal:0,carb:0,protein:0,fat:0})}
function clamp(n,min,max){return Math.max(min,Math.min(max,n))}

let activeDateKey=localDateKey();
function renderDashboard(profile){
  const phone=document.getElementById("phone");
  phone.style.position="relative";
  phone.innerHTML=`<header class="app-header"><div class="app-title"><small>${GOAL_LABEL[profile.goal]} 목표</small><strong>오늘의 기록</strong></div><button class="icon-btn" id="menu-btn" aria-label="메뉴">•••</button></header><main class="dashboard" id="dashboard"></main>`;
  activeDateKey=localDateKey();
  document.getElementById("menu-btn").addEventListener("click",toggleProfileMenu);
  drawDashboard(profile);
}
function drawDashboard(profile){
  const dashboard=document.getElementById("dashboard"); if(!dashboard)return;
  const logs=getLogs(activeDateKey), total=sumLogs(logs), remain=profile.goalKcal-total.kcal, usedPct=clamp(total.kcal/profile.goalKcal*100,0,100);
  const unknownMacroCount=logs.filter(x=>x.nutrientKnown&&(!x.nutrientKnown.carb||!x.nutrientKnown.protein||!x.nutrientKnown.fat)).length;
  const macroRows=[
    ["탄수화물","carb",total.carb,profile.macros.carb],["단백질","protein",total.protein,profile.macros.protein],["지방","fat",total.fat,profile.macros.fat]
  ].map(([label,key,val,target])=>`<div class="macro-progress-item"><div class="macro-progress-head"><span>${label}</span><span>${Math.round(val)} / ${target}g</span></div><div class="progress-track"><div class="progress-fill ${key}" style="width:${clamp(val/target*100,0,100)}%"></div></div></div>`).join("");
  const mealCards=MEAL_RATIO.map(meal=>{
    const items=logs.filter(x=>x.meal===meal.key),mealTotal=sumLogs(items),target=Math.round(profile.goalKcal*meal.ratio);
    const list=items.length?`<div class="food-list">${items.map(x=>{
      const nk=x.nutrientKnown||{carb:true,protein:true,fat:true};
      const parts=[];if(nk.carb)parts.push(`탄 ${round1(Number(x.carb||0))}g`);if(nk.protein)parts.push(`단 ${round1(Number(x.protein||0))}g`);if(nk.fat)parts.push(`지 ${round1(Number(x.fat||0))}g`);
      if(x.servings&&Number(x.servings)!==1)parts.push(`${x.servings}인분`);if(x.sharedPeople&&Number(x.sharedPeople)>1)parts.push(`${x.sharedPeople}명 공유 · 1인 평균`);if(x.photo)parts.push("📷");
      return `<div class="food-item">${x.photo?`<img class="food-thumb" src="${escapeHtml(x.photo)}" alt="${escapeHtml(x.name)} 사진" />`:""}<div class="food-main"><div class="food-name">${escapeHtml(x.name)}</div><div class="food-meta">${parts.length?parts.join(" · "):"영양성분 미입력"}</div></div><div class="food-kcal">${Math.round(Number(x.kcal)).toLocaleString()} kcal</div><button class="delete-btn" data-delete="${x.id}" aria-label="삭제">×</button></div>`
    }).join("")}</div>`:`<div class="empty-meal">아직 기록이 없어요.</div>`;
    return `<section class="meal-card"><div class="meal-card-head"><div class="meal-title-wrap"><div class="meal-emoji">${meal.emoji}</div><div><div class="meal-name">${meal.label}</div><div class="meal-total">${Math.round(mealTotal.kcal).toLocaleString()} / ${target.toLocaleString()} kcal</div></div></div><button class="meal-add" data-add="${meal.key}" aria-label="${meal.label} 음식 추가">+</button></div>${list}</section>`
  }).join("");
  dashboard.innerHTML=`<div class="date-nav"><button class="date-arrow" id="prev-day">‹</button><div class="date-label">${formatDateLabel(activeDateKey)}</div><button class="date-arrow" id="next-day">›</button></div><section class="summary-card"><div class="summary-top"><div class="cal-ring" style="--progress:${usedPct*3.6}deg"><div class="cal-ring-center"><b>${Math.round(total.kcal).toLocaleString()}</b><span>/ ${profile.goalKcal.toLocaleString()} kcal</span></div></div><div class="remaining"><div class="label">${remain>=0?"남은 칼로리":"초과 칼로리"}</div><div class="value">${Math.abs(Math.round(remain)).toLocaleString()} <small>kcal</small></div><div class="sub">현재 섭취량 ${Math.round(total.kcal).toLocaleString()} kcal<br>${GOAL_LABEL[profile.goal]} 목표 ${profile.goalKcal.toLocaleString()} kcal</div></div></div><div class="energy-line"><div class="energy-stat"><span>기초대사량</span><b>${profile.bmr.toLocaleString()} kcal</b></div><div class="energy-stat"><span>활동량</span><b>${profile.activityKcal.toLocaleString()} kcal</b></div><div class="energy-stat"><span>유지 필요량</span><b>${profile.tdee.toLocaleString()} kcal</b></div></div></section><div class="section-title"><h2>탄단지</h2><span>오늘 목표 대비</span></div><section class="macro-card">${macroRows}${unknownMacroCount?`<div class="macro-missing-note">※ ${unknownMacroCount}개 기록은 일부 영양성분이 비어 있어 해당 탄단지 합계에서 제외됩니다.</div>`:""}</section><div class="section-title"><h2>식사 기록</h2><span>끼니별 권장량 기준</span></div>${mealCards}<button class="floating-add" id="quick-add">+ 음식 추가</button>`;
  dashboard.querySelector("#prev-day").addEventListener("click",()=>moveDate(-1,profile));dashboard.querySelector("#next-day").addEventListener("click",()=>moveDate(1,profile));dashboard.querySelectorAll("[data-add]").forEach(b=>b.addEventListener("click",()=>openFoodSheet(profile,b.dataset.add)));dashboard.querySelector("#quick-add").addEventListener("click",()=>openFoodSheet(profile,"lunch"));dashboard.querySelectorAll("[data-delete]").forEach(b=>b.addEventListener("click",()=>deleteFood(profile,b.dataset.delete)));
}
function moveDate(delta,profile){const d=parseLocalDate(activeDateKey);d.setDate(d.getDate()+delta);activeDateKey=localDateKey(d);drawDashboard(profile)}
function deleteFood(profile,id){const logs=getLogs(activeDateKey).filter(x=>String(x.id)!==String(id));setLogs(activeDateKey,logs);drawDashboard(profile)}
function escapeHtml(s){return String(s??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]))}
function normalizeFoodName(name){return String(name||"").normalize("NFKC").trim().toLocaleLowerCase("ko-KR").replace(/\s+/g,"")}
function localFoodDb(){try{return JSON.parse(localStorage.getItem("calorieTracker.foodDb"))||{}}catch{return{}}}
function seedLocalFoodDb(){
  const db=localFoodDb();let changed=false;
  BASIC_FOODS.forEach(f=>{const key=normalizeFoodName(f.name);if(!db[key]){db[key]={...f,macroKnown:true,nutrientKnown:{carb:true,protein:true,fat:true},sourceType:"seed",updatedAt:new Date().toISOString()};changed=true}});
  if(changed)try{localStorage.setItem("calorieTracker.foodDb",JSON.stringify(db))}catch{}
}
function rememberFoodLocal(food){
  if(!food||!food.name||!(Number(food.kcal)>0))return;
  const key=normalizeFoodName(food.name);if(!key)return;
  const db=localFoodDb(),existing=db[key];const incomingSource=food.sourceType||"manual";
  const nk=food.nutrientKnown||{carb:food.macroKnown!==false,protein:food.macroKnown!==false,fat:food.macroKnown!==false};
  if(existing&&existing.sourceType==="manual"&&incomingSource!=="manual"){
    const enk=existing.nutrientKnown||{carb:existing.macroKnown!==false,protein:existing.macroKnown!==false,fat:existing.macroKnown!==false};
    db[key]={...existing,
      carb:enk.carb?existing.carb:(nk.carb?round1(Number(food.carb||0)):existing.carb),
      protein:enk.protein?existing.protein:(nk.protein?round1(Number(food.protein||0)):existing.protein),
      fat:enk.fat?existing.fat:(nk.fat?round1(Number(food.fat||0)):existing.fat),
      nutrientKnown:{carb:enk.carb||nk.carb,protein:enk.protein||nk.protein,fat:enk.fat||nk.fat},updatedAt:new Date().toISOString()};
  }else{
    db[key]={name:String(food.name).trim(),servingDescription:String(food.servingDescription||""),servingGrams:Number(food.servingGrams||0),kcal:round1(Number(food.kcal)),carb:round1(Number(food.carb||0)),protein:round1(Number(food.protein||0)),fat:round1(Number(food.fat||0)),macroKnown:nk.carb&&nk.protein&&nk.fat,nutrientKnown:nk,sourceType:incomingSource,sourceUrls:food.sourceUrls||[],updatedAt:new Date().toISOString()};
  }
  try{localStorage.setItem("calorieTracker.foodDb",JSON.stringify(db))}catch{}
}
function lookupFoodLocal(name){const raw=normalizeFoodName(name);if(!raw)return null;const key=BASIC_FOOD_ALIASES[raw]||raw;return localFoodDb()[key]||null}
async function apiJson(url,options={}){
  if(location.protocol==="file:")throw new Error("AI/웹 검색 기능은 server.js로 실행해야 합니다.");
  const response=await fetch(url,{...options,headers:{"Content-Type":"application/json",...(options.headers||{})}});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.message||`서버 오류 (${response.status})`);return data
}
async function lookupFoodDatabase(name){
  if(location.protocol!=="file:"){
    try{const data=await apiJson(`/api/foods/lookup?name=${encodeURIComponent(name)}`,{method:"GET",headers:{}});if(data.found&&data.food){rememberFoodLocal(data.food);return data.food}}catch(err){console.warn("food lookup failed",err)}
  }

  try{const dataUrl=await compressFoodPhoto(file);backdrop._photoDataUrl=dataUrl;backdrop.querySelector("#photo-preview").src=dataUrl;backdrop.querySelector("#photo-preview-wrap").classList.add("show");status.textContent="AI가 음식 사진을 분석 중이에요…";setAnalysisState(backdrop,{badge:"분석 중",badgeClass:"working",message:"음식명을 인식한 뒤 DB를 확인하고, 필요하면 웹 검색까지 진행합니다."});const result=await analyzeFoodPhoto(dataUrl);if(!backdrop.isConnected)return;if(result.status==="recognized"||result.status==="searched"){const sourceType=result.method==="web"?"web":result.method==="database_vision"?"database_vision":"vision";applyNutritionToForm(backdrop,{name:result.name,servingDescription:result.servingDescription,servingGrams:result.servingGrams||0,kcal:result.kcal,carb:result.carb,protein:result.protein,fat:result.fat,macroKnown:true,nutrientKnown:{carb:true,protein:true,fat:true}},{sourceType,message:result.servingDescription?`${result.servingDescription} 기준으로 자동 입력했습니다.`:"사진 기준 영양정보를 자동 입력했습니다.",sources:result.sourceUrls||[]});const confidence=Math.round(Number(result.confidence||0)*100);const badge=result.method==="database_vision"?"사진+DB":result.status==="searched"?"웹 검증":"AI 인식";setAnalysisState(backdrop,{badge,badgeClass:result.status==="searched"?"web":"ok",message:`${result.message||"영양정보를 계산했습니다."}${confidence?` · 신뢰도 ${confidence}%`:""}`,sources:result.sourceUrls||[]});status.textContent=result.method==="database_vision"?"사진 인식 후 음식 DB로 계산했어요.":result.status==="searched"?"웹 검색까지 확인해 자동 입력했어요.":"AI 분석으로 자동 입력했어요."}else{backdrop._nutritionSource="manual";backdrop._autoSnapshot="";setAnalysisState(backdrop,{badge:"수기 입력",badgeClass:"manual",message:result.message||"자동 분석으로 확정하지 못했습니다. 칼로리만 입력해도 저장할 수 있습니다.",sources:result.sourceUrls||[]});status.textContent="자동 인식이 어려워 수기 입력이 필요해요."}}
  catch(err){console.error(err);backdrop._nutritionSource="manual";backdrop._autoSnapshot="";setAnalysisState(backdrop,{badge:"수기 입력",badgeClass:"manual",message:`자동 분석을 완료하지 못했습니다. ${err.message||""} 칼로리만 입력해도 저장할 수 있습니다.`});status.textContent="자동 분석을 완료하지 못했어요."}finally{if(backdrop.isConnected){saveBtn.disabled=false;addBtn.disabled=false;setTimeout(()=>status.classList.remove("show"),1800)}}
}
async function analyzeFoodPhoto(dataUrl){if(location.protocol==="file:")return{status:"manual_required",method:"none",confidence:0,message:"현재 파일을 직접 열어 실행 중이라 AI 서버에 연결할 수 없습니다. 기본 DB는 사용할 수 있고, 사진 분석/웹 검색은 server.js로 실행하면 사용할 수 있습니다.",sourceUrls:[]};return apiJson("/api/foods/analyze",{method:"POST",body:JSON.stringify({imageDataUrl:dataUrl})})}
function removeFoodPhoto(backdrop,{resetAnalysis=true}={}){backdrop._photoDataUrl="";const preview=backdrop.querySelector("#photo-preview");preview.removeAttribute("src");backdrop.querySelector("#photo-preview-wrap").classList.remove("show");backdrop.querySelector("#camera-input").value="";backdrop.querySelector("#gallery-input").value="";if(resetAnalysis)setAnalysisState(backdrop,{badge:"대기",message:"사진을 올리거나 음식명을 입력한 뒤 자동 채우기를 사용할 수 있어요."})}
function compressFoodPhoto(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=()=>reject(new Error("file read failed"));reader.onload=()=>{const img=new Image();img.onerror=()=>reject(new Error("image decode failed"));img.onload=()=>{const maxSide=1024,scale=Math.min(1,maxSide/Math.max(img.naturalWidth||img.width,img.naturalHeight||img.height));const width=Math.max(1,Math.round((img.naturalWidth||img.width)*scale)),height=Math.max(1,Math.round((img.naturalHeight||img.height)*scale));const canvas=document.createElement("canvas");canvas.width=width;canvas.height=height;const ctx=canvas.getContext("2d");ctx.drawImage(img,0,0,width,height);let out=canvas.toDataURL("image/jpeg",.78);if(out.length>1500000)out=canvas.toDataURL("image/jpeg",.62);if(out.length>2200000)out=canvas.toDataURL("image/jpeg",.48);resolve(out)};img.src=String(reader.result)};reader.readAsDataURL(file)})}
async function persistManualFood(food){rememberFoodLocal({...food,sourceType:"manual"});if(location.protocol==="file:")return false;try{await apiJson("/api/foods/manual",{method:"POST",body:JSON.stringify(food)});return true}catch(err){console.warn("manual food DB save failed",err);return false}}
async function saveFood(profile,backdrop){
  const q=id=>backdrop.querySelector(id),error=q("#sheet-error"),saveBtn=q("#food-save");const current=currentFoodFromForm(backdrop,{silent:true});if(current===false){currentFoodFromForm(backdrop);return}if(current)backdrop._pending.push({...current,id:Date.now()+Math.random().toString(16).slice(2)});if(!backdrop._pending.length){error.textContent="기록할 음식을 하나 이상 입력해 주세요.";return}error.textContent="";saveBtn.disabled=true;
  try{for(const item of backdrop._pending)if(item.needsDbSave)await persistManualFood({name:item.name,servingDescription:item.servingDescription,servingGrams:item.servingGrams,kcal:item.kcal,carb:item.carb,protein:item.protein,fat:item.fat,nutrientKnown:item.nutrientKnown,macroKnown:item.macroKnown});else rememberFoodLocal({...item,sourceType:item.source});const people=Math.max(1,Number(backdrop._sharePeople||1)),meal=q("#food-meal").value,logs=getLogs(activeDateKey);backdrop._pending.forEach(item=>{const factor=item.servings/people;logs.push({id:Date.now()+Math.random().toString(16).slice(2),meal,name:item.name,kcal:round1(item.kcal*factor),carb:item.nutrientKnown.carb?round1(item.carb*factor):0,protein:item.nutrientKnown.protein?round1(item.protein*factor):0,fat:item.nutrientKnown.fat?round1(item.fat*factor):0,nutrientKnown:item.nutrientKnown,photo:item.photo||"",source:item.source||"manual",servings:item.servings,sharedPeople:people,baseKcal:item.kcal,createdAt:new Date().toISOString()})});setLogs(activeDateKey,logs);backdrop.remove();drawDashboard(profile)}catch(err){console.error(err);error.textContent="기록 저장 중 문제가 발생했어요. 사진 저장 공간이 부족한 경우 사진을 빼고 다시 시도해 주세요.";saveBtn.disabled=false}
}
function round1(n){return Math.round(n*10)/10}
function closeOverlays(){document.querySelectorAll(".sheet-backdrop,.profile-popover").forEach(el=>el.remove())}
function toggleProfileMenu(){const existing=document.querySelector(".profile-popover");if(existing){existing.remove();return}const phone=document.getElementById("phone"),menu=document.createElement("div");menu.className="profile-popover";menu.innerHTML='<button id="menu-today">오늘로 이동</button><button id="menu-restart">프로필 다시 계산</button><button class="danger" id="menu-reset">모든 기록 초기화</button>';phone.appendChild(menu);menu.querySelector("#menu-today").onclick=()=>{activeDateKey=localDateKey();menu.remove();const p=JSON.parse(localStorage.getItem("calorieTracker.profile"));drawDashboard(p)};menu.querySelector("#menu-restart").onclick=()=>{localStorage.removeItem("calorieTracker.profile");location.reload()};menu.querySelector("#menu-reset").onclick=()=>{if(confirm("프로필과 모든 식사 기록을 삭제할까요?")){Object.keys(localStorage).filter(k=>k.startsWith("calorieTracker.")).forEach(k=>localStorage.removeItem(k));location.reload()}}}

async function runFlow(){
  await addBotMessage("안녕하세요 👋 시작 전에 몇 가지만 여쭤볼게요.");
  await addBotMessage("성별이 어떻게 되세요?",{delay:400});
  state.gender=await askChoice([{label:"여성",value:"female"},{label:"남성",value:"male"}]);
  await addBotMessage("나이는 몇 세인가요?");state.age=await askText({placeholder:"예: 35",unit:"세",validate:numberValidator({min:10,max:100}),displayFormat:v=>`${v}세`});
  await addBotMessage("키는 몇 cm예요?");state.height=await askText({placeholder:"예: 170",unit:"cm",validate:numberValidator({min:100,max:250}),displayFormat:v=>`${v}cm`});
  await addBotMessage("현재 체중은요?");state.weight=await askText({placeholder:"예: 55",unit:"kg",inputMode:"decimal",validate:numberValidator({min:30,max:250,isInt:false}),displayFormat:v=>`${v}kg`});
  await addBotMessage("목표 체중은 몇 kg으로 잡을까요?");state.targetWeight=await askText({placeholder:"예: 50",unit:"kg",inputMode:"decimal",validate:numberValidator({min:30,max:250,isInt:false}),displayFormat:v=>`${v}kg`});

  const previewBmr=Math.round(calcBMR(state));
  const autoActivity=Math.round(previewBmr*AUTO_ACTIVITY_RATE);
  await addBotMessage(`기초대사량은 약 ${previewBmr.toLocaleString()} kcal예요. 활동량도 계수가 아니라 칼로리로 계산할게요.`);
  await addBotMessage(`평균 활동 기준으로는 하루 약 ${autoActivity.toLocaleString()} kcal가 추가로 소모돼요. 그대로 쓸까요?`);
  const activityChoice=await askChoice([{label:`자동 ${autoActivity.toLocaleString()} kcal`,value:"auto"},{label:"직접 입력할게요",value:"manual"}]);
  if(activityChoice==="manual"){
    await addBotMessage("하루 활동으로 추가 소모하는 칼로리를 입력해 주세요.");
    state.activityKcal=await askText({placeholder:"예: 700",unit:"kcal / 일",inputMode:"decimal",validate:numberValidator({min:0,max:5000,isInt:false}),displayFormat:v=>`${v.toLocaleString()} kcal`});
  }else state.activityKcal=autoActivity;

  await addBotMessage("마지막으로, 목표가 뭐예요?");state.goal=await askChoice([{label:"다이어트",value:"lose"},{label:"유지",value:"maintain"},{label:"벌크업",value:"gain"}]);
  headerStatus.textContent="계산 중…";await addBotMessage(`좋아요! ${GOAL_LABEL[state.goal]} 목표에 맞게 계산해볼게요.`,{delay:650});
  const computed=calculate(),profile=saveProfile(computed);renderResultCard(computed);headerStatus.textContent="온라인";await sleep(350);await addBotMessage("오늘부터 이 기준으로 기록을 시작해봐요!",{delay:450});
  showCTA("시작하기",()=>{addUserMessage("시작하기");clearInputBar();setTimeout(()=>renderDashboard(profile),180)});
}
function bootCalorieTracker(){
  seedLocalFoodDb();
  try{
    const saved=JSON.parse(localStorage.getItem("calorieTracker.profile")||"null");
    if(saved&&saved.goalKcal&&saved.bmr){
      renderDashboard(saved);
      return;
    }
  }catch(err){
    console.warn("저장된 프로필을 불러오지 못했습니다.",err);
  }
  runFlow().catch(err=>{
    console.error(err);clearInputBar();const row=document.createElement("div");row.className="row bot";row.innerHTML='<div class="bubble"></div>';row.querySelector(".bubble").textContent=`문제가 발생했어요: ${err.message||err}`;thread.appendChild(row)
  });
}
bootCalorieTracker();
</script>
